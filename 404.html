<!DOCTYPE html>
<html lang="es">
<head>
<!-- Raíz del despliegue: "/" en dominio propio y "/pelis/" en GitHub Pages
     (project site). Se deduce del primer segmento conocido de la ruta y se
     aplica antes de pedir CSS/JS, de modo que los assets resuelvan en ambos
     despliegues. Debe ejecutarse antes de cualquier recurso. -->
<script>
(function () {
  var ROUTE = /^(detalle|peliculas|series|episodios|genero|pais|tag|animes|tendencias|imdb|home|privacidad|terminos|cookies|contacto|legal|css|js|data|index\.html)$/i;
  var parts = location.pathname.split("/").filter(Boolean);
  var root = null;
  for (var i = 0; i < parts.length; i++) {
    if (ROUTE.test(parts[i])) {
      root = i ? "/" + parts.slice(0, i).join("/") + "/" : "/";
      break;
    }
  }
  if (!root) {
    if (!parts.length) root = "/";
    else if (parts.length === 1) root = "/" + parts[0] + "/";          // raíz de un despliegue en subruta
    else if (/\.github\.io$/i.test(location.hostname)) root = "/" + parts[0] + "/"; // URL inventada en Pages
    else root = "/";
  }
  document.write('<base href="' + root + '">');
})();
</script>
