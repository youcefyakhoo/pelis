name: update-catalog

# PelisLatinoHD clone - incremental catalog worker.
# Keeps data/catalog.json fresh without a full re-scrape, then commits so
# GitHub Pages (deploy from branch main) picks up the change automatically.

on:
  schedule:
    # every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run incremental updater
        run: node scraper/update.mjs

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/meta/genres.json data/meta/countries.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "chore: update catalog $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi